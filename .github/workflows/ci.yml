name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests with coverage (statement + branch report)
        run: uv run pytest tests/ --cov=medulla --cov-branch --cov-report=term-missing --tb=short -q

      - name: Enforce statement coverage ≥ 95%
        run: uv run pytest tests/ --cov=medulla --cov-fail-under=95 -q --no-header 2>&1 | tail -3
