[project]
name = "medulla"
version = "0.1.0"
description = "Three-layer memory for Claude Code and Kiro — episodic, semantic, codebase"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=0.103.1",
    "anyio>=4.13.0",
    "boto3>=1.43.12",
    "httpx>=0.28.1",
    # Exact pin: 2.0 removed the API mcp.py used, and uv tool install ignores uv.lock.
    "mcp==2.0.0",
    "pymupdf>=1.27.2.3",
    "rich>=15.0.0",
    "sentence-transformers>=5.5.1",
    "sqlite-vec>=0.1.9",
    "tomli-w>=1.2.0",
    "trafilatura>=2.0.0",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]

[project.scripts]
medulla = "medulla.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
python-preference = "only-managed"
